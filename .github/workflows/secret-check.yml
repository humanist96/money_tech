name: Secret Check (temporary)

# Prints only the character length of each secret, never the value.
# Delete this workflow once the secrets are confirmed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret lengths
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING OPENAI_API_KEY DART_API_KEY; do
            value="${!name}"
            printf '%s: length=%s\n' "$name" "${#value}"
          done
