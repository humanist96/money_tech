name: MoneyTech Crawler

on:
  schedule:
    - cron: '0 */6 * * *'  # 매 6시간 (0, 6, 12, 18시 UTC)
  workflow_dispatch:  # 수동 실행

jobs:
  # Applies any migration the live database has not seen yet. Every crawl job
  # depends on this, so schema drift can no longer accumulate silently.
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migrate.py

  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run YouTube crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKIP_SUBTITLE: '1'
        run: |
          cd crawler
          python main.py

  blog:
    runs-on: ubuntu-latest
    # Measured in CI: ~18s per blogger (RSS + new-post content fetch + NLP),
    # so 153 bloggers need ~46 min. A 30-minute cap cut the run off at 101.
    timeout-minutes: 60
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run Blog crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd crawler
          python blog_crawler.py

  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run Telegram crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          cd crawler
          python telegram_crawler.py

  analyst-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run Analyst Report crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd crawler
          python report_crawler.py

  daily-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: migrate
    # Independent of the slow channel loop. Backfills the last 14 KST days so any
    # missed window self-heals after a youtube job timeout.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Compute daily_stats (with 14d backfill)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd crawler
          python compute_stats.py --backfill

  evaluate:
    runs-on: ubuntu-latest
    # The price-fetch loop is rate-limited by the upstream quote APIs and has been
    # hitting the 15-minute cap on every run, so evaluation never finished (only
    # ~5% of predictions are evaluated). Raised until the evaluator rewrite lands.
    timeout-minutes: 45
    needs: [youtube, blog, telegram, analyst-report]
    if: always() && (needs.youtube.result == 'success' || needs.blog.result == 'success' || needs.telegram.result == 'success' || needs.analyst-report.result == 'success')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      # Self-healing for price-history gaps: if the evaluate job fails for a
      # stretch, record_daily_prices leaves holes that no later run repairs on
      # its own — daily snapshots only cover "today". The backfill's skip
      # heuristic makes this cheap when there is nothing to repair, and
      # evaluate.py's requeue step then reopens verdicts the new prices unlock.
      # 120 days, not 60: the 3-month horizon scores t0+90, so a window shorter
      # than that can never restore a t0 price the evaluator still needs — the
      # gap it is meant to repair would stay open by construction.
      - name: Repair price-history gaps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd crawler
          python backfill_prices.py --history --days 120

      - name: Collect prices & evaluate predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd crawler
          python evaluate.py

      - name: Log completion
        if: always()
        run: echo "Pipeline finished at $(date -u)"
